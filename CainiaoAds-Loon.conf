# NAME: Cainiao-Ads
# 菜鸟 App 净化 —— 墨鱼版规则 + 自持脚本
# 规则来源：@ddgksf2013（原文件 https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/CainiaoAds.conf）
#
# 本版特点：规则和脚本全部指向你自己的仓库，不依赖任何第三方仓库
# 脚本走 jsDelivr CDN，全程不访问 github.com / raw.githubusercontent.com
#
# 上传前请确认下面两处地址里的用户名和仓库名是你的：
#   https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/amdc.js
#   https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/cainiao_json.js
# 如果你的 GitHub 用户名不是 zzxyscc，或仓库名不叫 cainiao-moyu，把这两处改掉
#
# 仓库文件结构（3 个文件都放在仓库根目录）：
#   CainiaoAds.conf     本文件
#   amdc.js
#   cainiao_json.js
#
# Loon 用法：配置 → 重写 → 右上角 + → 引用 → + → 粘贴下面的地址，然后开启「重写」和「MitM」
#   https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/CainiaoAds.conf
#
# 注意：使用前请先卸载菜鸟 App，挂载脚本后再重新安装

[Rewrite]

# > 菜鸟裹裹_amdc 处理
^https?:\/\/amdc\.m\.taobao\.com url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/amdc.js
# > 菜鸟裹裹_我的页面去除推广[卸载重装]
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/cainiao_json.js
# > 菜鸟裹裹_首页中部的问邻居推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbpresentation\.homepage\.merge\.get\.cn url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/cainiao_json.js
# > 菜鸟裹裹_首页中部的惊喜福利推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbpresentation\.protocol\.homepage\.get\.cn url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/cainiao_json.js
# > 菜鸟裹裹_搜索框下方今日好物推荐
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.adkeyword url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/cainiao_json.js
# > 菜鸟裹裹_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.(?!.*_home) url reject-200
# > 菜鸟裹裹_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.mshow\.cn url reject-200
# > 菜鸟裹裹_首页底部商品推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbcps\.presentation\.fetch\.cn url reject-200
# > 菜鸟裹裹_底部角标推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.app\.home\.v\d+\.bottom\.area url reject-200


# > 菜鸟裹裹_支付宝小程序_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\. url reject-200
# > 菜鸟裹裹_支付宝小程序_底部商品推广新
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.alimama\.abyss\.unionpage\.get url reject-200
# > 菜鸟裹裹_支付宝小程序_底部商品推广旧
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.adx\.flyad\.getad url reject-200
# > 菜鸟裹裹_支付宝小程序_匿名选择
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.nbmensa\.research\.researchservice\.consultmerge url reject-200


[MitM]
hostname = %APPEND% *.cainiao.com, guide-acs.m.taobao.com, acs4miniapp-inner.m.taobao.com
